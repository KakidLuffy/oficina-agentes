name: Agentes de trading (simulación)

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agentes
  cancel-in-progress: false

jobs:
  paso:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar un paso de la simulación
        run: python agentes_nube.py

      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "agentes-bot"
          git config user.email "agentes-bot@users.noreply.github.com"
          git add datos
          git diff --staged --quiet || git commit -m "Actualizar simulación"
          git push
