name: Agentes de trading (simulación)

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]      # solo en main: una rama de pruebas nunca debe lanzar la simulación real
    paths:
      - agentes_nube.py
      - persistencia.py
      - archivado.py
      - .github/workflows/agentes.yml

permissions:
  contents: read          # mínimo por defecto; solo el trabajo que publica datos recibe escritura

concurrency:
  group: agentes
  cancel-in-progress: false

jobs:
  paso:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Pruebas automáticas (si fallan, no se toca ningún dato)
        run: python -m unittest discover -s tests -t .

      - name: Ejecutar un paso de la simulación (hasta 3 intentos si falla la red)
        run: bash scripts/reintentar.sh python agentes_nube.py

      - name: Comprobar que los datos son coherentes
        run: python verificar_salida.py datos

      - name: Guardar resultados en el repositorio (reintenta, nunca fuerza)
        run: bash scripts/guardar_datos.sh "Actualizar simulación" datos

  alerta:
    needs: paso
    if: ${{ always() && needs.paso.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write        # solo este trabajo puede abrir o cerrar la alerta
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Avisar del fallo (sin duplicados) o cerrar la alerta si ya se recuperó
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ needs.paso.result }}" = "success" ]; then
            bash scripts/alerta_fallo.sh cerrar "Fallo del workflow: simulación de agentes" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            bash scripts/alerta_fallo.sh abrir "Fallo del workflow: simulación de agentes" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
