name: Prueba histórica de H1 (a mano)

on:
  workflow_dispatch:       # solo a mano desde la pestaña Actions: no toca la simulación en vivo

permissions:
  contents: write

concurrency:
  group: agentes
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Probar H1 con todo el historial diario de BTC y ETH
        run: python backtest_h1.py --out datos

      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "agentes-bot"
          git config user.email "agentes-bot@users.noreply.github.com"
          git add datos/backtest_h1.md datos/backtest_h1.json
          git diff --staged --quiet || git commit -m "Prueba histórica de H1"
          git pull --rebase
          git push
