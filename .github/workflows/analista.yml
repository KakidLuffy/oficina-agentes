name: Analista experimental (solo propone)

on:
  workflow_dispatch:       # solo a mano: es experimental y nunca actúa por su cuenta

permissions:
  contents: read

concurrency:
  group: agentes
  cancel-in-progress: false

jobs:
  analista:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Redactar propuestas (solo lectura de datos; nunca opera ni cambia límites)
        run: python analista.py --datos datos --out datos

      - name: Guardar solo las propuestas (reintenta, nunca fuerza)
        run: bash scripts/guardar_datos.sh "Propuestas del analista (pendientes de revisión)" datos/propuestas_analista.json datos/propuestas_analista.md

  alerta:
    needs: analista
    if: ${{ always() && needs.analista.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write        # solo este trabajo puede abrir o cerrar la alerta
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Avisar del fallo (sin duplicados) o cerrar la alerta si ya se recuperó
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ needs.analista.result }}" = "success" ]; then
            bash scripts/alerta_fallo.sh cerrar "Fallo del workflow: analista experimental" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            bash scripts/alerta_fallo.sh abrir "Fallo del workflow: analista experimental" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
