name: Director de la oficina (parte, revisión y memoria)

on:
  workflow_run:
    workflows: ["Agentes de trading (simulación)", "Laboratorio de estrategias (semanal)"]
    types: [completed]
  workflow_dispatch:       # o a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: agentes
  cancel-in-progress: false

jobs:
  director:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: El director revisa los datos y escribe el parte
        run: python director.py --datos datos

      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "agentes-bot"
          git config user.email "agentes-bot@users.noreply.github.com"
          git add datos
          git diff --staged --quiet || git commit -m "Parte del director"
          git pull --rebase
          git push
