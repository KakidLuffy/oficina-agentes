name: Director de la oficina (parte, revisión y memoria)

on:
  workflow_run:
    workflows: ["Agentes de trading (simulación)", "Laboratorio de estrategias (semanal)"]
    types: [completed]
  workflow_dispatch:       # o a mano desde la pestaña Actions

permissions:
  contents: read

concurrency:
  group: agentes
  cancel-in-progress: false

jobs:
  director:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: El director revisa los datos y escribe el parte
        run: python director.py --datos datos

      - name: Guardar resultados en el repositorio (reintenta, nunca fuerza)
        run: bash scripts/guardar_datos.sh "Parte del director" datos
