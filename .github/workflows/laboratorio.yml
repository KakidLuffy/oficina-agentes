name: Laboratorio de estrategias (semanal)

on:
  schedule:
    - cron: "23 5 * * 1"   # cada lunes
  workflow_dispatch:       # o a mano desde la pestaña Actions

permissions:
  contents: read

concurrency:
  group: agentes
  cancel-in-progress: false

jobs:
  laboratorio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Probar variantes de estrategias
        run: bash scripts/reintentar.sh python laboratorio.py --out datos

      - name: Guardar resultados en el repositorio (reintenta, nunca fuerza)
        run: bash scripts/guardar_datos.sh "Actualizar laboratorio de estrategias" datos/laboratorio.json datos/laboratorio.md

  alerta:
    needs: laboratorio
    if: ${{ always() && needs.laboratorio.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write        # solo este trabajo puede abrir o cerrar la alerta
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Avisar del fallo (sin duplicados) o cerrar la alerta si ya se recuperó
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ needs.laboratorio.result }}" = "success" ]; then
            bash scripts/alerta_fallo.sh cerrar "Fallo del workflow: laboratorio de estrategias" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            bash scripts/alerta_fallo.sh abrir "Fallo del workflow: laboratorio de estrategias" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
