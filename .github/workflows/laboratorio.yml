name: Laboratorio de estrategias (semanal)

on:
  schedule:
    - cron: "23 5 * * 1"   # cada lunes
  workflow_dispatch:       # o a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: laboratorio        # aparte de los agentes: si no, una ejecución larga dejaría rondas de la simulación sin hacer
  cancel-in-progress: false

jobs:
  laboratorio:
    runs-on: ubuntu-latest
    timeout-minutes: 45      # descarga años de velas de Coinbase (unas 800 peticiones)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Probar variantes de estrategias
        run: python laboratorio.py --out datos

      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "agentes-bot"
          git config user.email "agentes-bot@users.noreply.github.com"
          git add datos/laboratorio.json datos/laboratorio.md
          git diff --staged --quiet || git commit -m "Actualizar laboratorio de estrategias"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done; exit 1
